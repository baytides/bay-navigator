# County benefits offices — where Medi-Cal, CalFresh and CalWORKs applications
# are actually processed, plus statewide counselling for Medicare questions.
#
# WHY THIS FILE EXISTS: a real Carl session asked how to get Medi-Cal for a
# 77-year-old in San Mateo County. The directory had no entry for the agency
# that processes the application, so the assistant supplied a phone number from
# its own memory and had to tell the user to go and verify it. For someone
# applying for health coverage that is the single most important number on the
# page, and guessing it is not acceptable.
#
# Every number below was read off the agency's own site or the California
# Department of Social Services county directory on 2026-09-18. Re-verify before
# changing; do not edit from memory.

- id: alameda-county-social-services
  name: Alameda County Social Services Agency
  area: Alameda County
  counties: [alameda]
  impact: high
  groups:
    - everyone
    - income-eligible
    - seniors
    - disability
  keywords: Medi-Cal, CalFresh, food stamps, CalWORKs, General Assistance, benefits office, apply, Self Sufficiency Center, Alameda County, social services
  description: The county agency that accepts and processes Medi-Cal, CalFresh (food stamps), CalWORKs and General Assistance applications for Alameda County residents.
  what_they_offer: |-
    - Medi-Cal applications, renewals and eligibility questions
    - CalFresh (food stamps) applications and recertification
    - CalWORKs cash aid for families with children
    - General Assistance for adults without children
    - In-Home Supportive Services (IHSS) intake
  how_to_get_it: |-
    Apply online at BenefitsCal.com any time, or call the agency. Self Sufficiency Centers in Oakland, Hayward, Fremont, Livermore and Eden take walk-ins — call first to confirm hours.

    You can apply at any time of year. Bring photo ID, proof of income and proof of address if you have them, but a missing document is not a reason to delay applying.
  phone: (510) 263-2420
  link: https://www.alamedacountysocialservices.org/
  link_text: Apply or find an office
  verified_date: '2026-09-18'

