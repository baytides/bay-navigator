# Homepage contextual pills — timely prompts shown under the search box.
#
# `expires` (YYYY-MM-DD) is enforced at build time: a pill stops rendering the
# day after it expires, whatever `active` says. Dated pills used to outlive
# themselves — "Tax filing help through Apr 15" was still on the homepage in
# September, which quietly tells people the whole site is stale.
#
# A pill with no `expires` is evergreen. Anything mentioning a deadline in
# `detail` should always carry one.

pills:
  - label: Transit status
    detail: Live updates
    href: /transit
    active: true

  - label: Eligibility guide
    detail: 2-min quiz
    href: /eligibility
    active: true

  # Seasonal examples — set the dates and flip `active` when they come round.
  # - label: Tax filing help
  #   detail: through Apr 15
  #   href: /directory?category=Finance
  #   active: true
  #   expires: 2027-04-15
  #
  # - label: FAFSA deadline
  #   detail: through Jun 30
  #   href: /directory?category=Education
  #   active: true
  #   expires: 2027-06-30
