- id: calvet-troops-to-trucks
  name: Troops to Trucks (CDL Waiver Program)
  area: Statewide
  counties: [all]
  impact: medium
  groups:
    - veterans
  keywords: CDL, commercial driver license, truck driver, veteran, military, waiver, trucking, Class A, Class B, DD214, DMV
  description: The California Troops to Trucks program allows qualifying service members and veterans with military driving experience to obtain a commercial driver's license (CDL) without taking the driving skills test. This fast-tracks veterans into high-demand trucking careers.
  what_they_offer: |
    - CDL driving (skills) test waiver for qualified service members and recent veterans
    - Exempt from Entry-Level Driver Training (ELDT) requirements
    - Faster path to a Class A or B commercial license
    - Does not apply to passenger or school bus endorsements
    - Leverages existing military driving experience
  how_to_get_it: |
    1. Be active duty, reserve, or National Guard, or within 12 months of discharge
    2. Have operated a military vehicle equivalent to a commercial motor vehicle, including at least 2 years immediately before discharge (or currently in that role)
    3. Have a qualifying driving record (no disqualifying offenses in the past 2 years)
    4. Complete the Commercial Military Waiver form (DL 965)
    5. Bring the DL 965, identity document, Social Security or Armed Forces ID, and DD 214 (veterans) to a DMV office
    6. Meet all other CA CDL requirements; the driving test is waived
  phone: 800-777-0133
  benefit: CDL driving test waiver for service members and recent veterans with military heavy-vehicle experience; fast-track to commercial trucking career
  how_to_use: Apply at DMV with form DL 965 and DD 214
  timeframe: Ongoing; veterans must apply within 12 months of discharge
  link: https://www.dmv.ca.gov/portal/driver-education-and-safety/special-interest-driver-guides/veterans-and-active-duty-military/
  link_text: Learn More
  verified_date: '2026-09-14'
