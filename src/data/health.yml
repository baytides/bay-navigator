    - Long-term care services
  how_to_get_it: Apply online at CoveredCA.com or BenefitsCal.com, through your county social services office, or by phone with Covered California at 1-800-300-1506 (Mon-Fri 8am-6pm). Adults generally qualify with income up to 138% of the poverty level (266% for children), or if they get CalFresh, SSI/SSP, or CalWORKs. You can apply any time of year and must renew once a year. Some benefits for certain adults are changing based on immigration status, so check with your county office.
