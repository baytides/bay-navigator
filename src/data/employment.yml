    EDD, unemployment, UI, unemployment insurance, jobless, laid off, unemployment benefits, California unemployment, weekly benefits, job loss
  description: >-
    California's Unemployment Insurance program provides temporary financial assistance to workers who lost their jobs through no fault of their own while they search for new employment.
  what_they_offer: |
    - Weekly unemployment benefits from $40 to $450 per week, based on past earnings
    - Up to 26 weeks of regular benefits
    - Extended benefits during periods of high unemployment (when available)
