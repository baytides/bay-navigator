- id: caleitc
  name: CalEITC – California Earned Income Tax Credit
  area: Statewide
  counties: [all]
  impact: medium
  groups:
    - income-eligible
    - families
  keywords: CalEITC, California Earned Income Tax Credit, EITC, tax refund, cash back, low income, working families, Young Child Tax Credit, ITIN, undocumented
  description: The California Earned Income Tax Credit (CalEITC) provides cash back to low-income working Californians. Combined with the federal EITC, families can receive thousands of dollars in tax refunds even if they owe no taxes.
  what_they_offer: |
    - Cash back tax credit up to $3,756 for tax year 2025 (varies by income and number of children)
    - Refundable credit – get money even if you owe no taxes
    - Young Child Tax Credit adds up to $1,189 for children under 6
    - Foster Youth Tax Credit up to $1,189 for eligible former foster youth
    - Can be combined with federal EITC for larger refund
    - Available to ITIN filers
    - Must be at least 18 or have a qualifying child
  how_to_get_it: |
    1. Earned income must be between $1 and $32,900 (tax year 2025)
    2. File California state tax return (Form 540)
    3. Complete form FTB 3514 (California Earned Income Tax Credit)
    4. Claim Young Child Tax Credit if you have children under 6
    5. Use free tax prep services (VITA) or CalFile for help filing
    6. File by April 15; you can generally claim CalEITC for up to four prior years by filing or amending
  benefit: Cash back up to $3,756 (tax year 2025); plus up to $1,189 Young Child Tax Credit; available to ITIN filers
  how_to_use: Claim on state tax return (Form 540 with FTB 3514)
  timeframe: File by April 15 annually (prior-year claims allowed for up to four years)
  link: https://www.ftb.ca.gov/file/personal/credits/caleitc/eligibility-and-credit-information.html
  link_text: Check Eligibility
