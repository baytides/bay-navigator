- id: pell-grant
  name: Federal Pell Grant
  category: Education
  area: Nationwide
  counties: [all]
  impact: high
  groups:
    - income-eligible
    - college-students
  keywords: Pell Grant, federal aid, financial aid, FAFSA, college, free money, undergraduate, low-income, student aid
  description: >-
    The Federal Pell Grant provides free money for college to undergraduate students with financial need. Unlike loans, Pell Grants do not need to be repaid.
  what_they_offer: |
    - Up to $7,395 per year (2026-2027)
    - Free money - no repayment required
    - Can be used for tuition, fees, books, and living expenses
    - Available at most colleges and universities
    - Can be combined with other financial aid
  how_to_get_it: |
    1. Complete the FAFSA at studentaid.gov
    2. Must demonstrate financial need (based on your Student Aid Index)
    3. Must be an undergraduate without a bachelor's degree
    4. Part-time students can qualify, but receive a smaller award
    5. Must be U.S. citizen or eligible noncitizen
    6. Amount depends on financial need, cost of attendance, and enrollment status
    7. Lifetime limit of 12 semesters (about 6 years) of Pell funding
  phone: 800-433-3243
  benefit: Up to $7,395/year in free federal grant money for college (no repayment)
  timeframe: Annual (renew FAFSA each year)
  link: https://studentaid.gov/understand-aid/types/grants/pell
  link_text: Learn More
  verified_date: '2026-09-14'
