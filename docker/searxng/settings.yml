use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - mojeek
      - wikipedia

general:
  instance_name: 'Carl Search'
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ''
  default_lang: 'en'
  formats:
    - html
    - json

server:
  secret_key: 'carl-searxng-local-only'
  bind_address: '0.0.0.0'
  limiter: false

ui:
  static_use_hash: true

engines:
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
