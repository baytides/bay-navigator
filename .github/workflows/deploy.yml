name: Deploy Website (Azure)

on:
  workflow_dispatch:
  push:
    branches: [main]

# Prevent concurrent deploys
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: dist
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API files
        run: node scripts/generate/generate-api.cjs

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_PMTILES_URL: ${{ secrets.PUBLIC_PMTILES_URL }}
          PUBLIC_OLLAMA_API_KEY: ${{ secrets.PUBLIC_OLLAMA_API_KEY }}

      - name: Sync programs to Meilisearch
        continue-on-error: true
        run: node scripts/sync/sync-meilisearch.cjs
        env:
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_ADMIN_KEY: ${{ secrets.MEILI_ADMIN_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  deploy-static:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          # No managed Functions API. The ./api folder is not a valid Functions app
          # (no function.json/host.json) and transit-live is unused; pointing
          # api_location at it only reserved the /api/* route and 404'd all the
          # static /api/*.json data files the frontend fetches. Leave empty so
          # /api/*.json serves as static content. Live functions are external
          # (*.azurewebsites.net), addressed by full URL, and unaffected.
          api_location: ''
          skip_app_build: true
        env:
          API_511_KEY: ${{ secrets.API_511_KEY }}
