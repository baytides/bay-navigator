name: Deploy Website (Azure)

on:
  workflow_dispatch:
  push:
    branches: [main]

# Prevent concurrent deploys
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: dist
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploy previously ran with no data validation at all: ci.yml and
      # deploy.yml both trigger on push to main with no dependency between
      # them, so nothing that validates data could block a release.
      - name: Validate data before building
        run: npm run validate:data

      - name: Generate API files
        run: node scripts/generate/generate-api.cjs

      # The Knowledge Pack (corpus.sqlite + manifest) is a build artifact, so it
      # is gitignored — which meant it was never generated in CI either, and
      # /data/knowledge-pack/ 404'd in production. The apps download it over the
      # air, so it has to be published. Municipal ordinance text is fetched from
      # public Azure Blob during this step; --no-municipal skips that if the
      # container is unreachable.
      - name: Generate Knowledge Pack
        run: npm run generate:pack

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_PMTILES_URL: ${{ secrets.PUBLIC_PMTILES_URL }}

      # Meilisearch sync removed 2026-09-16: the self-hosted search server was
      # shut down, so this step pushed data to a host that returns 502 on every
      # deploy. Search is now entirely client-side (Fuse.js over
      # /data/search-index.json). scripts/sync/sync-meilisearch.cjs is kept for
      # whenever a search server returns.

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  deploy-static:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          # No managed Functions API. The ./api folder is not a valid Functions app
          # (no function.json/host.json) and transit-live is unused; pointing
          # api_location at it only reserved the /api/* route and 404'd all the
          # static /api/*.json data files the frontend fetches. Leave empty so
          # /api/*.json serves as static content. Live functions are external
          # (*.azurewebsites.net), addressed by full URL, and unaffected.
          api_location: ''
          skip_app_build: true
        env:
          API_511_KEY: ${{ secrets.API_511_KEY }}
