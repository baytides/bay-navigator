name: Update Simple Language

# DECOMMISSIONED 2026-09-16 — automatic triggers disabled.
#
# Both scripts below POST to ai.baytides.org, the self-hosted Ollama server that
# has been shut down. Every run now fails: the weekly cron would fail silently
# each Sunday, and the push trigger fires on ANY change under src/data/**/*.yml,
# so ordinary data edits would produce a red X on main forever.
#
# The simplified descriptions this generated are committed and still ship with
# the site, so nothing is broken by not running it — the text simply stops being
# refreshed for newly added programs.
#
# To bring it back, restore a text-generation backend, point CARL_ENDPOINT at it,
# and re-enable the triggers below.
on:
  # Manual only. Re-add `schedule:` and `push:` when a backend exists again.
  workflow_dispatch:

jobs:
  update-simple-language:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Generate simple language word data (Ollama)
        env:
          CARL_API_KEY: ${{ secrets.PUBLIC_OLLAMA_API_KEY }}
        run: node scripts/generate/generate-simple-language.cjs

      - name: Generate simple program descriptions (Carl)
        continue-on-error: true
        env:
          CARL_API_KEY: ${{ secrets.PUBLIC_OLLAMA_API_KEY }}
        run: node scripts/generate/generate-simple-language-descriptions.cjs

      - name: Check for changes and commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add any changed files (ignore errors if files don't exist)
          git add public/data/simple-language.json public/data/simple-descriptions.json .simple-language-hashes.json 2>/dev/null || true

          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update simple language data [skip ci]

          Automated update of simplified content for WCAG 2.2 AAA compliance.

          🤖 Generated with Carl on Mac Mini (word alternatives and program descriptions)"
            git push
          fi
