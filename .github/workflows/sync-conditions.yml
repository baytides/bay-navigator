name: Sync Live Conditions

# Rehomed from two launchd jobs on a self-hosted Mac (2026-09-16):
# com.baytides.air-quality-sync (every 30 min) and com.baytides.conditions-sync
# (hourly). Combined into one workflow because they share a cadence, a data
# source (Open-Meteo, no API key) and a destination.
#
# No commit step: both scripts publish straight to Azure Blob (api-data
# container), and that is what the site and the Carl MCP server read. Nothing
# depends on a committed copy, so `contents: read` is enough.
#
# Carl exposes this through `get_local_conditions`. It matters most for people
# who are unhoused, work outdoors, or have asthma — which is why it runs often
# rather than daily.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync/sync-air-quality.cjs'
      - 'scripts/sync/sync-weather-forecast.cjs'

concurrency:
  group: sync-conditions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Independent steps: a wildfire day is exactly when air quality matters
      # most and is also when an upstream feed is most likely to wobble, so a
      # weather failure must not take air quality down with it.
      - name: Sync air quality
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: node scripts/sync/sync-air-quality.cjs

      - name: Sync weather forecast
        if: always()
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: node scripts/sync/sync-weather-forecast.cjs
