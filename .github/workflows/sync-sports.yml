name: Sync Sports Data

# Rehomed from a launchd job on a self-hosted Mac (2026-09-16).
#
# The site reads sports data from Azure Blob at build time, so the upload is the
# part that matters; the committed JSON is a convenience copy.

on:
  # Every 3 hours — matching the launchd interval it replaces.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync/sync-sports-data.cjs'

concurrency:
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync Bay Area sports schedules
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: node scripts/sync/sync-sports-data.cjs --verbose
        continue-on-error: true

      # No commit step: sync-sports-data.cjs publishes to Azure Blob
      # (api-data/sports-data.json), and that is what both consumers read — the
      # homepage theme picker and the Carl MCP server's get_bay_area_sports tool.
      # The standalone /sports pages were removed in this change; they showed
      # standings and schedules with nothing free, low-cost or community-related
      # on them, which is not what this directory is for. The data stays because
      # it is cheap, live, and genuinely useful conversationally.
      - name: Report result
        run: echo "Sports data published to Azure Blob; read live by the homepage theme and Carl."
