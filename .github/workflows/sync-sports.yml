name: Sync Sports Data

# Rehomed from a launchd job on a self-hosted Mac (2026-09-16).
#
# The site reads sports data from Azure Blob at build time, so the upload is the
# part that matters; the committed JSON is a convenience copy.

on:
  # Every 3 hours — matching the launchd interval it replaces.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync/sync-sports-data.cjs'

concurrency:
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync Bay Area sports schedules
        env:
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: node scripts/sync/sync-sports-data.cjs --verbose
        continue-on-error: true

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add public/data/sports-data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Sync sports data [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
