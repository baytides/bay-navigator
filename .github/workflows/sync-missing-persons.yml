name: Sync Missing Persons

# Rehomed from a launchd job on a self-hosted Mac (2026-09-16).
#
# The old runner did `git fetch && git checkout main && git pull` every 15
# minutes against a working copy someone might be using — which silently
# stomped on whatever branch was checked out. Running it here removes that
# hazard and the dependency on one machine being awake.
#
# Carl enrichment is skipped: CARL_API_URL pointed at the retired inference
# server, and the script already degrades to unenriched records when it fails.

on:
  # NCMEC data is time-sensitive; keep it frequent.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync/sync-missing-persons.cjs'

# Never let two syncs race for the same commit.
concurrency:
  group: sync-missing-persons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync missing persons from NCMEC
        env:
          # Optional. Without it the script skips push notifications.
          PUSH_FUNCTION_KEY: ${{ secrets.PUSH_FUNCTION_KEY }}
          # Uploads the public copy to Azure Blob; skipped when unset.
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: node scripts/sync/sync-missing-persons.cjs --verbose

      # No commit step, deliberately.
      #
      # Azure Blob is the source of truth for this data and the site reads it at
      # runtime: the alert banner, the alerts index and the build all fetch the
      # blob. Committing a copy every 15 minutes would add churn to main for a
      # file nothing depends on, and each commit would race the next sync.
      #
      # The copy in public/api/ remains as an offline/local-build fallback; it is
      # refreshed whenever someone runs the sync locally, which is enough.
      - name: Report result
        run: |
          echo "Data published to Azure Blob. The site reads it live — no commit needed."
          if [ -f public/api/missing-persons.json ]; then
            node -e "const d=require('./public/api/missing-persons.json'); console.log(\`cases: \${d.cases.length}\`)"
          fi
