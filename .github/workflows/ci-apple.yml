name: CI - Apple Platforms (Native Swift)

on:
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - 'scripts/generate/generate-knowledge-pack.cjs'
      - '.github/actions/knowledge-pack/**'
      - '.github/workflows/ci-apple.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - 'scripts/generate/generate-knowledge-pack.cjs'
      - '.github/actions/knowledge-pack/**'
      - '.github/workflows/ci-apple.yml'

concurrency:
  group: ci-apple-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/apple

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Xcode 26 ships the FoundationModels SDK. On Xcode 16.4 every
      # `#if canImport(FoundationModels)` block compiled out, so the entire
      # on-device Carl agent was never built or tested here.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build on-device Knowledge Pack
        uses: ./.github/actions/knowledge-pack

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (iOS)"

      - name: Build iOS (Debug)
        run: |
          xcodebuild -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (iOS)" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Xcode 26 ships the FoundationModels SDK. On Xcode 16.4 every
      # `#if canImport(FoundationModels)` block compiled out, so the entire
      # on-device Carl agent was never built or tested here.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build on-device Knowledge Pack
        uses: ./.github/actions/knowledge-pack

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (macOS)"

      - name: Build macOS (Debug)
        run: |
          xcodebuild -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (macOS)" \
            -destination 'platform=macOS' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  build-visionos:
    name: Build visionOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Xcode 26 ships the FoundationModels SDK. On Xcode 16.4 every
      # `#if canImport(FoundationModels)` block compiled out, so the entire
      # on-device Carl agent was never built or tested here.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks | grep -i xros || echo "Checking for visionOS..."

      - name: Build on-device Knowledge Pack
        uses: ./.github/actions/knowledge-pack

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (visionOS)"

      - name: Build visionOS (Debug)
        run: |
          xcodebuild -project BayNavigator.xcodeproj \
            -scheme "Bay Navigator (visionOS)" \
            -destination 'generic/platform=visionOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  test-core:
    name: Test BayNavigatorCore
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Xcode 26 ships the FoundationModels SDK. On Xcode 16.4 every
      # `#if canImport(FoundationModels)` block compiled out, so the entire
      # on-device Carl agent was never built or tested here.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build on-device Knowledge Pack
        uses: ./.github/actions/knowledge-pack

      - name: Run BayNavigatorCore tests
        working-directory: apps/apple/BayNavigatorCore
        run: swift test

  strict-concurrency:
    name: Strict concurrency (targeted)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Xcode 26 ships the FoundationModels SDK. On Xcode 16.4 every
      # `#if canImport(FoundationModels)` block compiled out, so the entire
      # on-device Carl agent was never built or tested here.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build on-device Knowledge Pack
        uses: ./.github/actions/knowledge-pack

      # BayNavigatorCore is clean at `targeted`; this keeps it that way while
      # the app targets catch up, and is the first step of the Swift 6 /
      # OS 27 migration. Only our own sources are checked — dependency
      # warnings are not our to fix.
      - name: Check BayNavigatorCore is clean under -strict-concurrency=targeted
        working-directory: apps/apple/BayNavigatorCore
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=targeted 2>&1 | tee /tmp/sc.log
          if grep -E 'Sources/BayNavigatorCore/.*\.swift:[0-9]+:[0-9]+: warning:' /tmp/sc.log; then
            echo "::error::New strict-concurrency warnings in BayNavigatorCore"
            exit 1
          fi
          echo "BayNavigatorCore is clean under -strict-concurrency=targeted"

  swift-lint:
    name: Swift Lint
    runs-on: macos-26
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: apps/apple
        run: swiftlint lint --reporter github-actions-logging || true
