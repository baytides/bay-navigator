name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent concurrent CI runs on same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data schema
        run: npm run validate:data

      - name: Check data freshness
        run: npm run validate:freshness

      - name: Check readability scores
        run: node scripts/check/check-readability.cjs

  test:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and generate API
        run: |
          npm ci
          node scripts/generate/generate-api.cjs

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start preview server
        # --background is explicit on purpose. `astro preview` daemonizes on
        # macOS but stays in the foreground on the Ubuntu runner, so a bare
        # `npm run preview` here returned immediately on a laptop and blocked
        # the job forever in CI. The flag makes the behaviour the same in both
        # places. Playwright then attaches via reuseExistingServer rather than
        # spawning a server whose exit it would misread as a crash.
        run: |
          npx astro preview --background
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/ >/dev/null && echo "preview up" && exit 0
            sleep 1
          done
          echo "preview server never became reachable" >&2
          npx astro preview logs || true
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  accessibility:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and generate API
        run: |
          npm ci
          node scripts/generate/generate-api.cjs

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start preview server
        # --background is explicit on purpose. `astro preview` daemonizes on
        # macOS but stays in the foreground on the Ubuntu runner, so a bare
        # `npm run preview` here returned immediately on a laptop and blocked
        # the job forever in CI. The flag makes the behaviour the same in both
        # places. Playwright then attaches via reuseExistingServer rather than
        # spawning a server whose exit it would misread as a crash.
        run: |
          npx astro preview --background
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/ >/dev/null && echo "preview up" && exit 0
            sleep 1
          done
          echo "preview server never became reachable" >&2
          npx astro preview logs || true
          exit 1

      - name: Run accessibility tests
        run: npx playwright test --project=accessibility

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: test-results/
          retention-days: 14

  # Weekly link validation (runs on schedule, not on every PR)
  validate-links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[validate-links]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate program links
        run: node scripts/validate/validate-links.cjs --report
        continue-on-error: true

      - name: Upload link validation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: link-validation-report
          path: link-validation-report.json
          retention-days: 30
