version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - 'astro*'
          - '@astrojs/*'
      testing:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'
      linting:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@eslint/*'
          - '@typescript-eslint/*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
      - 'automated'
    commit-message:
      prefix: 'ci'

  # Flutter dependencies (pub)
  - package-ecosystem: 'pub'
    directory: '/apps'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'flutter'
      - 'automated'
    commit-message:
      prefix: 'deps(flutter)'

  # Azure Functions runtime dependencies. These ship to production but live in
  # their own manifest, so the root npm entry above never sees them.
  - package-ecosystem: 'npm'
    directory: '/azure-functions'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'azure-functions'
      - 'automated'
    commit-message:
      prefix: 'deps(functions)'

  # Build and data-sync scripts
  - package-ecosystem: 'npm'
    directory: '/scripts'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps(scripts)'

  # Telegram bot
  - package-ecosystem: 'npm'
    directory: '/telegram-bot'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps(telegram-bot)'

  # Docker images used for self-hosted services
  - package-ecosystem: 'docker'
    directory: '/docker/tor-proxy'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps(docker)'
